<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Begnex</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #050b18;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .error-container {
            position: relative;
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 50px 30px;
        }

        /* Blue glow */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #0066ff;
            filter: blur(140px);
            opacity: 0.25;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #1683ff;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 170px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -8px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #1683ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin-top: 20px;
            font-size: 34px;
            font-weight: 700;
        }

        p {
            margin-top: 15px;
            color: #9ca9bd;
            font-size: 16px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;

            background: #086cff;
            color: white;

            text-decoration: none;
            font-size: 15px;
            font-weight: 600;

            border-radius: 8px;

            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.35);

            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #0055d4;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 102, 255, 0.5);
        }

        .line {
            width: 70px;
            height: 3px;
            background: #1683ff;
            margin: 25px auto;
            border-radius: 10px;
        }

        @media (max-width: 600px) {

            .error-code {
                font-size: 110px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="glow"></div>

        <div class="brand">
            BEGNEX
        </div>

        <div class="error-code">
            404
        </div>

        <div class="line"></div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist,
            may have been moved, or is temporarily unavailable.
        </p>

        <a href="/" class="home-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
